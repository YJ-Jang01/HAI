<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AIflix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">AIFLIX</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">TV Shows</a>
    <a href="#">Movies</a>
    <a href="#">New & Popular</a>
  </nav>
</header>

<section class="hero" id="hero">
  <div class="hero-content">
    <h1 id="hero-title">Space Journey</h1>
    <p id="hero-desc">지구 너머 미지의 세계로 떠나는 고요한 여정. 지금 감상하세요.</p>
    <div class="hero-btns">
      <button class="btn-play" onclick="playContent()">▶ Play</button>
      <button class="btn-info">ⓘ More Info</button>
    </div>
  </div>
  <div class="hero-vignette"></div>
</section>

<div class="search-container">
  <div class="input-area">
    <input id="input" placeholder="Genres: relaxing, action...">
    <button class="search-btn" onclick="runAI()">Search</button>
  </div>
</div>

<main>
</main>

<div id="expand" class="expand">
  <div class="expand-container">
    <span class="close-btn" onclick="closeExpand()">×</span>
    
    <div class="expand-video-wrapper">
      <video id="bg-video" autoplay muted loop></video>
      <div class="expand-vignette"></div>
      <div class="expand-header-content">
        <h1 id="expand-title"></h1>
        <div class="expand-btns">
          <button class="btn-play" onclick="playContent()">▶ 재생</button>
          <button class="btn-my-list">+</button>
        </div>
      </div>
    </div>

    <div class="expand-bottom-info">
      <p id="expand-desc" class="description"></p>
      
      <div class="episodes-section">
        <h3>회차</h3>
        <div id="episodes-list" class="episodes-list">
          </div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
